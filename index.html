<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mind Reset Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="stars"></div>

  <!-- HUB SCREEN -->
  <div id="hub-screen" class="screen active">
    <header class="hub-header">
      <div class="header-sparkles">
        <span class="sparkle">✦</span>
        <h1 class="hub-title">MIND RESET HUB</h1>
        <span class="sparkle">✦</span>
      </div>
      <p class="hub-subtitle">Pick a place to reset your mind and find some peace.</p>
    </header>

    <div class="hub-grid">
      <!-- FREE TO PLAY -->
      <div class="section-label free-label">FREE TO PLAY</div>

      <div class="card free" data-section="diamond" style="--card-glow:#00e5ff">
        <div class="card-img diamond-img">
          <div class="pixel-heart">
            <div class="heart-pixel-grid" id="heart-preview"></div>
          </div>
        </div>
        <div class="card-name">DIAMOND MIND RESET</div>
      </div>

      <div class="card free" data-section="breathing" style="--card-glow:#4fc3f7">
        <div class="card-img breathing-img">
          <div class="breathing-cube-preview">
            <div class="cube-face cube-top"></div>
            <div class="cube-face cube-front"></div>
            <div class="cube-face cube-side"></div>
          </div>
        </div>
        <div class="card-name">BREATHING BLOCKS</div>
      </div>

      <div class="card free" data-section="thought" style="--card-glow:#9c27b0">
        <div class="card-img thought-img">
          <div class="cave-preview">
            <div class="torch-preview">🔥</div>
          </div>
        </div>
        <div class="card-name">THOUGHT MINER CAVE</div>
      </div>

      <div class="card free" data-section="campfire" style="--card-glow:#ff9800">
        <div class="card-img campfire-img">
          <div class="fire-preview">
            <div class="flame f1"></div>
            <div class="flame f2"></div>
            <div class="flame f3"></div>
          </div>
        </div>
        <div class="card-name">CAMPFIRE REFLECTION</div>
      </div>

      <div class="card free" data-section="forest" style="--card-glow:#66bb6a">
        <div class="card-img forest-img">
          <div class="forest-preview">
            <div class="tree t1">🌲</div>
            <div class="tree t2">🌲</div>
            <div class="tree t3">🌲</div>
          </div>
        </div>
        <div class="card-name">FOREST WHISPER</div>
      </div>

      <div class="card free" data-section="sunset" style="--card-glow:#ff7043">
        <div class="card-img sunset-img">
          <div class="sun-preview"></div>
        </div>
        <div class="card-name">SUNSET RESET</div>
      </div>

      <!-- PREMIUM REALMS -->
      <div class="section-label premium-label">PREMIUM REALMS 👑</div>

      <div class="card premium" data-section="rain" style="--card-glow:#90a4ae">
        <div class="premium-badge">👑</div>
        <div class="card-img rain-img">
          <div class="rain-preview">
            <div class="villager-preview">🧟</div>
            <div class="rain-drops" id="rain-preview-drops"></div>
          </div>
        </div>
        <div class="card-name">RAIN ROOM REALM</div>
      </div>

      <div class="card premium" data-section="biome" style="--card-glow:#ce93d8">
        <div class="premium-badge">👑</div>
        <div class="card-img biome-img">
          <div class="portal-preview">
            <div class="portal-swirl"></div>
          </div>
        </div>
        <div class="card-name">BIOME SHIFT PORTAL</div>
      </div>

      <div class="card premium" data-section="deep" style="--card-glow:#29b6f6">
        <div class="premium-badge">👑</div>
        <div class="card-img deep-img">
          <div class="crystal-preview">
            <div class="crystal c1">💎</div>
            <div class="crystal c2">💎</div>
            <div class="crystal c3">💎</div>
          </div>
        </div>
        <div class="card-name">DEEP CAVE CALM</div>
      </div>
    </div>
  </div>

  <!-- SECTION SCREENS -->
  <div id="section-screen" class="screen">
    <button class="back-btn" onclick="goBack()">◀ BACK</button>
    <div id="section-content"></div>
  </div>

  <script src="js/stars.js"></script>
  <script src="js/sections/diamond.js"></script>
  <script src="js/sections/breathing.js"></script>
  <script src="js/sections/thought.js"></script>
  <script src="js/sections/campfire.js"></script>
  <script src="js/sections/forest.js"></script>
  <script src="js/sections/sunset.js"></script>
  <script src="js/sections/rain.js"></script>
  <script src="js/sections/biome.js"></script>
  <script src="js/sections/deep.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
