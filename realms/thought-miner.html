<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../shared/bbb-realms.css">
  <title>Thought Miner Cave</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; overflow: hidden; }

    .scene {
      position: fixed; inset: 0; overflow: hidden;
      background:
        radial-gradient(ellipse 70% 55% at 50% 50%, #2a0e4a 0%, #14072a 40%, #080410 70%, #020108 100%);
    }

    /* Cave walls — rough stone texture */
    .cave-bg {
      position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background:
        /* Left rocky wall */
        linear-gradient(90deg, #0a0812 0%, #120a20 8%, transparent 22%),
        /* Right rocky wall */
        linear-gradient(270deg, #0a0812 0%, #120a20 8%, transparent 22%),
        /* Ceiling */
        linear-gradient(180deg, #050310 0%, #0d0720 12%, transparent 28%),
        /* Floor */
        linear-gradient(0deg, #0a0610 0%, transparent 20%);
    }

    /* Stone block texture on walls */
    .wall-stones {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 30px, rgba(80,60,120,.06) 30px, rgba(80,60,120,.06) 32px),
        repeating-linear-gradient(90deg, transparent, transparent 36px, rgba(80,60,120,.04) 36px, rgba(80,60,120,.04) 38px);
    }

    /* Purple crystal glow from depths */
    .crystal-glow {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background:
        radial-gradient(ellipse 30% 40% at 15% 60%, rgba(140,60,255,.15) 0%, transparent 60%),
        radial-gradient(ellipse 20% 30% at 85% 70%, rgba(100,40,200,.12) 0%, transparent 55%),
        radial-gradient(ellipse 50% 30% at 50% 100%, rgba(120,50,220,.1) 0%, transparent 50%);
      animation: crystalPulse 4s ease-in-out infinite alternate;
    }
    @keyframes crystalPulse { 0%{opacity:.7} 100%{opacity:1} }

    /* Floating purple particles */
    .particle { position:absolute; border-radius:50%; pointer-events:none; z-index:3; animation:floatUp linear infinite; }
    @keyframes floatUp { 0%{opacity:0;transform:translateY(0) scale(0)} 20%{opacity:1} 80%{opacity:.8} 100%{opacity:0;transform:translateY(-120px) scale(.5)} }

    /* Ground */
    .ground {
      position: absolute; bottom: 0; left: 0; right: 0; height: 18%; z-index: 3; pointer-events: none;
      background:
        repeating-linear-gradient(90deg, transparent, transparent 50px, rgba(0,0,0,.2) 50px, rgba(0,0,0,.2) 52px),
        linear-gradient(180deg, #1a1020 0%, #100a18 50%, #080510 100%);
    }

    /* Pickaxe — center, large and glowing */
    .pickaxe-wrap {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 6; pointer-events: none;
      animation: pickSwing 1.1s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 18px #b15cff) drop-shadow(0 0 40px rgba(177,92,255,.5));
    }
    .pickaxe-wrap span { font-size: 100px; display: block; }
    @keyframes pickSwing { 0%{transform:translate(-50%,-50%) rotate(-18deg)} 100%{transform:translate(-50%,-50%) rotate(14deg)} }

    /* Arrow */
    .arrow-wrap {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      z-index: 5; pointer-events: none; width: 100%;
      display: flex; justify-content: center;
    }
    .big-arrow {
      font-size: 70px; color: #b15cff;
      filter: drop-shadow(0 0 20px #b15cff);
      animation: arrowPulse 1.5s ease-in-out infinite alternate;
    }
    @keyframes arrowPulse { 0%{opacity:.6;transform:translateX(-8px)} 100%{opacity:1;transform:translateX(8px)} }

    /* Top bar */
    .top-bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 18px 22px;
    }
    .top-title h1 { font-family:ui-monospace,monospace; font-size:clamp(16px,2.8vw,24px); font-weight:900; color:#fff; margin:0 0 3px; text-shadow:0 2px 8px #000; letter-spacing:.05em; }
    .top-title p { font-family:ui-monospace,monospace; font-size:13px; color:#ccc; margin:0; text-shadow:0 1px 4px #000; }
    .top-controls { display:flex; align-items:center; gap:10px; }
    .ctrl-btn { width:48px; height:48px; background:rgba(0,0,0,.6); border:2px solid rgba(255,255,255,.22); border-radius:12px; color:#fff; font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer; backdrop-filter:blur(4px); font-family:inherit; }
    .gem-count { background:rgba(0,0,0,.6); border:2px solid rgba(255,255,255,.22); border-radius:12px; color:#fff; font-family:ui-monospace,monospace; font-size:16px; padding:10px 14px; backdrop-filter:blur(4px); }

    /* Two block columns — overlaid on scene */
    .columns-wrap {
      position: absolute;
      top: 80px; bottom: 68px; left: 0; right: 0;
      z-index: 8;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      max-width: 1000px; margin: 0 auto;
      padding: 14px 20px 80px;
      pointer-events: none;
    }

    .col-loud { display:flex; flex-direction:column; justify-content:flex-start; gap:10px; pointer-events:all; }
    .col-calm { display:flex; flex-direction:column; justify-content:flex-start; gap:10px; pointer-events:all; }

    .col-title {
      font-family:ui-monospace,monospace; font-size:13px; font-weight:900;
      letter-spacing:.06em; text-align:center; margin-bottom:4px;
      text-shadow:0 2px 8px #000;
    }
    .title-loud { color: #ff6666; }
    .title-calm { color: #88ee66; }

    /* Thought blocks */
    .block {
      min-height: 72px; padding: 10px 12px;
      background: linear-gradient(135deg, #3a3040 0%, #1e1828 50%, #14101e 100%);
      border: 2px solid #504860; color: #fff;
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      text-align: center; cursor: pointer;
      box-shadow: inset -4px -4px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.6);
      font-family: ui-monospace, monospace; font-size: 13px; line-height: 1.4;
      transition: transform .2s, opacity .4s, box-shadow .2s;
      user-select: none;
    }
    .block:hover { background:linear-gradient(135deg,#4a4050,#2e2838,#201828); box-shadow:inset -4px -4px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.7),0 0 12px rgba(177,92,255,.2); }
    .block:active { transform:scale(.96); }
    .block.mined { transform:scale(.1) translateX(500px); opacity:0; pointer-events:none; transition:transform .4s ease-in,opacity .35s; }

    /* Reframe blocks */
    .reframe-block {
      min-height: 72px; padding: 10px 12px;
      background: linear-gradient(135deg, #4a3820 0%, #2e2210 50%, #1e1808 100%);
      border: 2px solid #6a5030; color: #fff;
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
      text-align: center;
      font-family: ui-monospace, monospace; font-size: 13px; line-height: 1.4;
      opacity: .18;
      box-shadow: inset -4px -4px rgba(0,0,0,.4), 0 6px 16px rgba(0,0,0,.6);
      transition: opacity .5s, box-shadow .5s, border-color .5s;
    }
    .reframe-block.glow {
      opacity: 1;
      border-color: #f6c65b;
      box-shadow: 0 0 24px rgba(246,198,91,.6), inset 0 0 12px rgba(246,198,91,.15);
      animation: reframePop .5s ease;
    }
    @keyframes reframePop { 0%{transform:scale(.88)} 60%{transform:scale(1.06)} 100%{transform:scale(1)} }

    /* Progress bar */
    .progress-wrap {
      position: absolute; bottom: 84px; left: 50%; transform: translateX(-50%);
      width: 280px; z-index: 9;
    }
    .progress-track { height: 20px; background: rgba(0,0,0,.5); border: 2px solid #5a3a9a; border-radius: 4px; overflow: hidden; }
    .progress-bar { height: 100%; width: 0; background: linear-gradient(90deg, #783cff, #e0a8ff); transition: width .4s; }
    .progress-label { text-align:center; font-family:ui-monospace,monospace; font-size:11px; color:#aaa; margin-top:5px; }

    /* Reward panel */
    .reward-panel {
      position: absolute; bottom: 84px; right: 20px; z-index: 9;
      background:rgba(0,0,0,.72); border:2px solid rgba(255,255,255,.2);
      border-radius:14px; padding:16px 18px; text-align:center; min-width:130px;
      box-shadow:0 8px 28px rgba(0,0,0,.7); backdrop-filter:blur(4px);
      font-family:ui-monospace,monospace;
    }
    .r-label { color:#f6c65b; font-size:11px; font-weight:900; letter-spacing:.1em; margin-bottom:8px; }
    .r-amount { font-size:30px; font-weight:900; color:#fff; }
    .r-unit { font-size:12px; color:#aaa; margin-top:2px; }

    .bottom-hint { position:absolute; bottom:44px; left:0; right:0; z-index:10; text-align:center; font-family:ui-monospace,monospace; font-size:13px; color:rgba(255,255,255,.45); text-shadow:0 1px 4px #000; }

    .vignette { position:absolute; inset:0; z-index:4; pointer-events:none; background:radial-gradient(ellipse 100% 100% at 50% 50%,transparent 40%,rgba(0,0,0,.7) 100%); }

    /* Mine particles */
    .mine-particle { position:fixed; pointer-events:none; z-index:20; animation:mineParticle .7s linear forwards; }
    @keyframes mineParticle { to{transform:translate(var(--tx),var(--ty)) scale(.1);opacity:0} }

    .nav { position:absolute; bottom:0; left:0; right:0; z-index:20; }
  </style>
  <link rel="stylesheet" href="./realm-backgrounds.css">
<link rel="stylesheet" href="../shared/minecraft-v2-theme.css"/>
</head>
<body>
<div style="position:fixed;inset:0;overflow:hidden;">
<div class="scene thought-miner-bg">

  <div class="cave-bg"></div>
  <div class="wall-stones"></div>
  <div class="crystal-glow"></div>
  <div class="ground"></div>
  <div class="vignette"></div>

  <!-- Large central pickaxe -->
  <div class="pickaxe-wrap"><span>⛏️</span></div>

  <!-- Top bar -->
  <div class="top-bar">
    <div class="top-title">
      <h1>⛏️ THOUGHT MINER CAVE</h1>
      <p>Mine the loud thoughts. Find the calmer truth.</p>
    </div>
    <div class="top-controls">
      <button class="ctrl-btn" onclick="toggleCave()">🔊</button>
      <div class="gem-count">💎 <span data-diamonds>250</span></div>
    </div>
  </div>

  <!-- Two columns of blocks -->
  <div class="columns-wrap">
    <!-- Loud thoughts -->
    <div class="col-loud">
      <div class="col-title title-loud">BIG &amp; LOUD</div>
      <div id="loudBlocks"></div>
    </div>
    <!-- Reframed thoughts -->
    <div class="col-calm">
      <div class="col-title title-calm">SMALLER &amp; REFRAMED</div>
      <div id="calmBlocks"></div>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="progress-wrap">
    <div class="progress-track"><div id="bar" class="progress-bar"></div></div>
    <div class="progress-label">Keep mining to find more reframes! <span id="mineCount">0</span>/5</div>
  </div>

  <!-- Reward -->
  <div class="reward-panel">
    <div class="r-label">REWARD</div>
    <div><span style="font-size:20px">💎</span> <span class="r-amount">+15</span></div>
    <div class="r-unit">Diamonds</div>
  </div>

  <div class="bottom-hint">Tap a heavy thought to mine it away</div>

  <nav class="nav pixel">
    <a href="../index.html">🏠 Home</a><a>📖 Journal</a><a>💗 Mood</a>
    <a class="active">🌍 My World</a><a>👤 Account</a>
  </nav>

</div>
</div>

<script src="../shared/bbb-realms.js"></script>
<script>
  // ── SOUND PLACEHOLDERS ──────────────────────────────────────────────────────
  // CAVE_AMBIENT  → /public/sounds/cave-drips.mp3
  // MINE_CRACK    → /public/sounds/mine-crack.mp3
  // REFRAME_CHIME → /public/sounds/reframe-chime.mp3
  // ──────────────────────────────────────────────────────────────────────────

  const loudThoughts = [
    "I'm not enough","I always mess up","What if I fail?",
    "I can't handle this","I'm not good at anything"
  ];
  const calmThoughts = [
    "I am learning and growing","I'm doing my best","One step at a time",
    "I can handle challenges","I am enough as I am"
  ];

  let mined = 0;
  const loudEl = document.getElementById('loudBlocks');
  const calmEl = document.getElementById('calmBlocks');

  // Build loud blocks
  loudThoughts.forEach((text, i) => {
    const b = document.createElement('div');
    b.className = 'block';
    b.textContent = text;
    b.style.marginBottom = '10px';
    b.onclick = (e) => mine(b, i, e);
    loudEl.appendChild(b);
  });

  // Build calm blocks
  calmThoughts.forEach(text => {
    const b = document.createElement('div');
    b.className = 'reframe-block';
    b.textContent = text;
    b.style.marginBottom = '10px';
    calmEl.appendChild(b);
  });

  // Spawn floating particles
  function spawnParticle() {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 2 + Math.random() * 4;
    p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;bottom:${10+Math.random()*60}%;background:hsl(${270+Math.random()*40},80%,65%);animation-duration:${3+Math.random()*4}s;animation-delay:${Math.random()*2}s;`;
    document.querySelector('.scene').appendChild(p);
    setTimeout(() => p.remove(), 7000);
  }
  setInterval(spawnParticle, 400);

  function mine(el, i, e) {
    if (el.classList.contains('mined')) return;
    el.classList.add('mined');
    BBBRealms.sound.mine(); // PLACEHOLDER: MINE_CRACK
    // Particles
    for (let p = 0; p < 8; p++) {
      const particle = document.createElement('span');
      particle.className = 'mine-particle';
      particle.textContent = ['✦','◆','✸','●'][p%4];
      particle.style.cssText = `left:${e.clientX}px;top:${e.clientY}px;color:hsl(${270+Math.random()*40},80%,70%);font-size:${10+Math.random()*10}px;`;
      particle.style.setProperty('--tx', (Math.random()-0.5)*120+'px');
      particle.style.setProperty('--ty', -(40+Math.random()*80)+'px');
      document.body.appendChild(particle);
      setTimeout(() => particle.remove(), 800);
    }
    calmEl.children[i].classList.add('glow');
    mined++;
    document.getElementById('mineCount').textContent = mined;
    document.getElementById('bar').style.width = (mined/loudThoughts.length*100)+'%';
    if (mined === loudThoughts.length) BBBRealms.addDiamonds(15);
  }

  let caveOn = false;
  function toggleCave() {
    caveOn = !caveOn;
    if (caveOn) BBBRealms.sound.ambient('caves'); // PLACEHOLDER: CAVE_AMBIENT
    else BBBRealms.sound.stop();
  }
</script>
<script src="../shared/minecraft-v2-ui.js"></script>
</body>
</html>
