<!doctype html>

  <title>Biome Shift Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { height: 100%; overflow: hidden; }

    .scene {
      position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden;
      background: radial-gradient(ellipse 80% 70% at 50% 30%, #1a0840 0%, #0e0428 40%, #060214 70%, #020108 100%);
    }

    /* Stars */
    .stars {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 5% 4%, #fff, transparent),
        radial-gradient(1px 1px at 15% 8%, #ffffffcc, transparent),
        radial-gradient(1px 1px at 28% 3%, #ffffff88, transparent),
        radial-gradient(1.5px 1.5px at 42% 7%, #ffffffbb, transparent),
        radial-gradient(1px 1px at 55% 2%, #ffffffaa, transparent),
        radial-gradient(1px 1px at 68% 9%, #ffffff77, transparent),
        radial-gradient(1px 1px at 80% 4%, #ffffffcc, transparent),
        radial-gradient(1px 1px at 92% 6%, #ffffff99, transparent),
        radial-gradient(1px 1px at 10% 20%, #ffffff55, transparent),
        radial-gradient(2px 2px at 35% 16%, #c084fc33, transparent),
        radial-gradient(1px 1px at 62% 18%, #ffffff44, transparent),
        radial-gradient(1px 1px at 88% 22%, #ffffff33, transparent),
        radial-gradient(1px 1px at 22% 35%, #ffffff33, transparent),
        radial-gradient(1px 1px at 75% 30%, #a855f722, transparent);
      animation: starTwinkle 6s ease-in-out infinite alternate;
    }
    @keyframes starTwinkle { 0%{opacity:.5} 100%{opacity:1} }

    /* Nebula */
    .nebula {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 40% 25% at 15% 25%, rgba(120,60,220,.1) 0%, transparent 70%),
        radial-gradient(ellipse 30% 20% at 80% 20%, rgba(160,80,255,.08) 0%, transparent 65%),
        radial-gradient(ellipse 50% 18% at 50% 70%, rgba(80,40,180,.06) 0%, transparent 55%);
    }

    /* Vignette */
    .vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse 100% 100% at 50% 50%, transparent 45%, rgba(0,0,0,.55) 100%);
    }

    /* ── Top bar ── */
    .top-bar {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 22px 12px;
    }
    .top-left { display: flex; align-items: center; gap: 14px; }
    .portal-icon { font-size: 32px; filter: drop-shadow(0 0 10px #9333ea); }
    .top-left h1 {
      font-family: ui-monospace, monospace;
      font-size: clamp(18px, 3vw, 26px); font-weight: 900; color: #fff;
      margin: 0 0 3px; letter-spacing: .05em; text-shadow: 0 2px 8px #000;
    }
    .top-left p { font-family: ui-monospace, monospace; font-size: 13px; color: #ccc; margin: 0; }
    .ctrl-btn {
      width: 48px; height: 48px; background: rgba(0,0,0,.6);
      border: 2px solid rgba(255,255,255,.22); border-radius: 12px;
      color: #fff; font-size: 20px; display: flex; align-items: center;
      justify-content: center; cursor: pointer; backdrop-filter: blur(4px); font-family: inherit;
    }

    /* ── Content wrapper ── */
    .content {
      position: relative; z-index: 5;
      max-width: 860px; margin: 0 auto;
      padding: 0 18px 110px;
    }

    /* ── Biome grid ── */
    .biome-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }

    /* ── Biome card ── */
    .biome-card {
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      border: 3px solid rgba(255,255,255,.12);
      background: #0a0818;
      box-shadow: 0 8px 24px rgba(0,0,0,.7);
      transition: transform .2s, border-color .2s, box-shadow .2s;
      position: relative;
    }
    .biome-card:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(255,255,255,.3);
      box-shadow: 0 14px 36px rgba(0,0,0,.8);
    }
    .biome-card.active {
      border-color: #70ff5d;
      box-shadow: 0 0 24px rgba(112,255,93,.5), 0 8px 28px rgba(0,0,0,.8);
    }
    .biome-card.locked { cursor: default; opacity: .75; }
    .biome-card.locked:hover { transform: none; }

    /* Active checkmark */
    .check-badge {
      display: none;
      position: absolute; top: 10px; left: 10px; z-index: 5;
      width: 28px; height: 28px; border-radius: 50%;
      background: #70ff5d; color: #000;
      font-size: 16px; font-weight: 900; line-height: 28px; text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.4);
    }
    .biome-card.active .check-badge { display: block; }

    /* Lock badge */
    .lock-badge {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      font-size: 36px; z-index: 5; filter: drop-shadow(0 2px 8px #000);
    }
    .lock-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 4;
    }

    /* SVG illustration area */
    .biome-art {
      width: 100%; height: 160px;
      display: block; overflow: hidden;
    }

    /* Card text */
    .biome-info {
      padding: 12px 14px 14px;
      background: linear-gradient(180deg, rgba(0,0,0,.0) 0%, rgba(0,0,0,.0) 100%);
    }
    .biome-name {
      font-family: ui-monospace, monospace;
      font-size: 13px; font-weight: 900; color: #fff;
      letter-spacing: .05em; margin: 0 0 5px;
      text-shadow: 0 1px 4px #000;
    }
    .biome-desc {
      font-family: ui-monospace, monospace;
      font-size: 12px; color: #bbb; line-height: 1.5; margin: 0;
    }

    /* ── Enter button ── */
    .enter-btn {
      display: block; width: 100%; padding: 16px;
      border: 0; border-radius: 12px;
      background: linear-gradient(180deg, #58b34b 0%, #296c27 100%);
      color: #fff; font-family: ui-monospace, monospace;
      font-size: 18px; font-weight: 900; cursor: pointer;
      box-shadow: inset 0 2px rgba(255,255,255,.25), 0 6px 0 #071604, 0 10px 24px rgba(0,0,0,.6);
      letter-spacing: .03em; text-align: center; margin-bottom: 12px;
    }
    .enter-btn:hover { background: linear-gradient(180deg, #68c35b, #396c37); }
    .enter-btn:active { transform: translateY(3px); box-shadow: inset 0 2px rgba(255,255,255,.25), 0 3px 0 #071604; }

    .now-playing {
      text-align: center; font-family: ui-monospace, monospace;
      font-size: 13px; color: #70ff5d; min-height: 20px;
      text-shadow: 0 0 10px rgba(112,255,93,.5);
    }
    .sound-hint {
      text-align: center; font-family: ui-monospace, monospace;
      font-size: 12px; color: rgba(255,255,255,.4); margin-top: 8px;
    }

    /* Nav */
    .nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; }

    @media (max-width: 600px) {
      .biome-grid { grid-template-columns: repeat(2,1fr); }
      .biome-art { height: 120px; }
    }

// ── Biome data ────────────────────────────────────────────────────────────────
const biomes = [
  { name:'Forest',         key:'forest',   desc:'Birds chirping, leaves rustling.',        locked:false },
  { name:'Beach',          key:'beach',    desc:'Waves crashing, soft ocean breeze.',       locked:false },
  { name:'Snowy Peaks',    key:'snow',     desc:'Wind howling, snow falling.',              locked:false },
  { name:'Desert',         key:'desert',   desc:'Warm breeze, peaceful stillness.',         locked:false },
  { name:'Mushroom Fields',key:'mushroom', desc:'Gentle ambience, dreamy and calm.',        locked:false },
  { name:'Deep Caves',     key:'caves',    desc:'Echoing drops, deep and quiet.',           locked:true  }
];

let selected = biomes[0], soundOn = false;
const grid = document.getElementById('biomeGrid');

biomes.forEach((b, i) => {
  const card = document.createElement('div');
  card.className = 'biome-card' + (i===0?' active':'') + (b.locked?' locked':'');

  card.innerHTML = `
    <div class="check-badge">✓</div>
    ${b.locked ? '<div class="lock-overlay"></div><div class="lock-badge">🔒</div>' : ''}
    <svg class="biome-art" viewBox="0 0 300 160" preserveAspectRatio="xMidYMid slice">
      ${biomeArt[b.key].replace(/<svg[^>]*>|<\/svg>/g,'')}
    </svg>
    <div class="biome-info">
      <div class="biome-name">${b.name.toUpperCase()}</div>
      <div class="biome-desc">${b.desc}</div>
    </div>`;

  if (!b.locked) {
    card.onclick = () => selectBiome(card, b);
  }
  grid.appendChild(card);
});

function selectBiome(card, biome) {
  document.querySelectorAll('.biome-card').forEach(c => c.classList.remove('active'));
  card.classList.add('active');
  selected = biome;
  document.getElementById('enterBtn').textContent = 'Enter ' + biome.name;
  if (soundOn) BBBRealms.sound.ambient(biome.key);
}

function enterBiome() {
  // PLACEHOLDER: play selected biome ambient sound
  BBBRealms.sound.ambient(selected.key);
  soundOn = true;
  BBBRealms.addDiamonds(5);
  document.getElementById('nowPlaying').textContent = '▶ Now playing: ' + selected.name + ' ambience';
}

function toggleSound() {
  if (soundOn) {
    BBBRealms.sound.stop(); soundOn = false;
    document.getElementById('nowPlaying').textContent = '';
  } else {
    BBBRealms.sound.ambient(selected.key); soundOn = true;
    document.getElementById('nowPlaying').textContent = '▶ Now playing: ' + selected.name + ' ambience';
  }
}
</script>
